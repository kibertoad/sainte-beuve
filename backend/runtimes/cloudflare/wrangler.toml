# The LIBRARY's own wrangler config: what `wrangler dev` and the workerd test pool
# run against. A deployment carries its own (see deploy/backend) with real ids and
# secrets; nothing here may reference an account.
name = "sainte-beuve-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# The reminder clock, every five minutes.
#
# It is not only about reminders any more, which is what makes hourly the wrong
# floor: the same tick polls the AI reviews in flight and an hourly cron meant a
# delegated review that parked on its findings waited up to an hour to be said
# out loud, where the Node runtime (REMINDER_INTERVAL_MS, sixty seconds by
# default) noticed within a minute. A capability wired differently on the two
# runtimes is the asymmetry this layout exists to prevent.
#
# Five minutes rather than one: the reminder ladder is measured in hours, so this
# is about the ceiling, not the cadence, and a pass over an idle deployment is a
# handful of indexed reads that find nothing due.
[triggers]
crons = ["*/5 * * * *"]

# A deployment serving its SPA from another origin lists it here, or sets
# APP_BASE_URL, whose origin is folded in: the SPA's client sends
# `credentials: 'include'` on every call and a browser refuses a `*` answer to
# one outright, so the wildcard alone reaches no browser-served SPA.
[vars]
CORS_ORIGINS = "*"

# The board's own database. Local to the suite and to `wrangler dev`: miniflare
# creates it, and the id below names nothing on any account. A deployment binds
# its own (see deploy/backend) and points `migrations_dir` at the copy of the
# migrations inside the installed @sainte-beuve/persistence-d1.
[[d1_databases]]
binding = "DB"
database_name = "sainte-beuve-local"
database_id = "sainte-beuve-local"
