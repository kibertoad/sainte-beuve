<!--
  What the page shows until the bundle has loaded and mounted the app, which
  replaces it. Plain HTML and CSS: nothing from the app (Tailwind, Nuxt UI, the
  icons) exists yet. `html.dark` is set by the colour-mode script in the head,
  which runs before this is parsed.
-->
<div class="sb-loading" role="status" aria-label="Loading">
  <div class="sb-loading-spinner"></div>
  <span class="sb-loading-name">sainte-beuve</span>
</div>
<style>
  .sb-loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: #fff;
    color: #525252;
    font-family: system-ui, sans-serif;
  }
  html.dark .sb-loading {
    background: #171717;
    color: #a3a3a3;
  }
  .sb-loading-spinner {
    width: 2rem;
    height: 2rem;
    border: 3px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: sb-spin 0.8s linear infinite;
  }
  .sb-loading-name {
    font-weight: 600;
  }
  @keyframes sb-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sb-loading-spinner {
      animation-duration: 2.4s;
    }
  }
</style>
