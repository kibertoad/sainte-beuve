# Backend deployment: Cloudflare Worker.
#
# This is the production-shaped EXAMPLE deployment of the @sainte-beuve/worker
# library. The Worker code IS the library (re-exported from src/index.ts); this file
# is all the per-deployment configuration. Copy this package, fill in the values
# below, and run `pnpm deploy`.
#
# It is a TEMPLATE, not a live deployment: every origin below is an example.com
# placeholder, and every credential is set with `wrangler secret put` rather than
# written here.
name = "sainte-beuve-backend"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# The reminder clock. Hourly matches the cadence the policy works in; a finer
# trigger only buys invocations that find nothing due.
[triggers]
crons = ["0 * * * *"]

# The board's own database. Create it once with
# `wrangler d1 create sainte-beuve` and paste the id it prints; the migrations
# ship inside the installed @sainte-beuve/persistence-d1, so
# `wrangler d1 migrations apply DB --remote` applies them from there and nothing
# has to be copied into this package.
#
# The `db:migrate` scripts name the BINDING rather than the database, so this
# file stays the only place the name is written: rename the database here and
# they follow.
#
# Without this binding the Worker still boots, on an in-memory store that an
# isolate recycle empties, and /health reports `persistence: "memory"`.
[[d1_databases]]
binding = "DB"
database_name = "sainte-beuve"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "node_modules/@sainte-beuve/persistence-d1/migrations"

[vars]
# Origins the SPA is served from. Comma-separated; `*` only for a preview, and
# even then the Configuration screen needs the SPA's own origin named here: the
# routes that hold a credential are excluded from the wildcard, so that a page an
# operator visits cannot preflight a write into this deployment's token store.
CORS_ORIGINS = "https://sainte-beuve.example.com"
# Where the SPA lives, so a Slack message can link back to a review.
APP_BASE_URL = "https://sainte-beuve.example.com"
# The cat-factory instance AI reviews are delegated to. Point this at your own
# local cat-factory (http://localhost:8787) or at the org's centralized one.
CAT_FACTORY_BASE_URL = "https://cat-factory.example.com"
CAT_FACTORY_SERVICE_ID = "REPLACE_WITH_CAT_FACTORY_SERVICE_ID"
# Slack channel new reviews are announced in.
SLACK_CHANNEL_ID = "REPLACE_WITH_SLACK_CHANNEL_ID"
# The GitHub App, by the two names it has. GITHUB_APP_ID signs the JWT and
# GITHUB_APP_SLUG addresses the public install page; both are needed before the
# Configuration screen can offer an install.
GITHUB_APP_ID = "REPLACE_WITH_GITHUB_APP_ID"
GITHUB_APP_SLUG = "REPLACE_WITH_GITHUB_APP_SLUG"
# The login the bot answers to when it is @-mentioned on a pull request. Either
# form of an App's login works: GitHub writes its comments as
# `sainte-beuve-bot[bot]` while people type `@sainte-beuve-bot`.
GITHUB_BOT_LOGIN = "REPLACE_WITH_APP_BOT_LOGIN"
# Whether this deployment insists on knowing who is calling. `required` refuses
# an anonymous call to everything under /api/v1 but the sign-in routes, and the
# workspace then renders for whoever is signed in rather than for whoever the
# deployment's credential acts as. A `required` Worker needs a way in: the App's
# OAuth client below for a person, AUTH_API_KEY for a machine. /health reports
# both, so a deployment nobody can enter is visible from outside.
#
# `open` is the laptop default and it is NOT a hosted one: an anonymous caller
# there is an ADMIN of the default org, which can replace this deployment's
# stored credentials, empty the project registry and spend the cat-factory key.
# A Worker that sets `open` beside APP_BASE_URL or a non-loopback CORS_ORIGINS
# refuses to serve rather than serving that, and an unrecognised value is a
# configuration error rather than a quiet `open`.
AUTH_MODE = "required"
# The labels that drive the board. These are the defaults; name your own.
GITHUB_LABEL_REVIEW = "needs-review"
GITHUB_LABEL_AI_REVIEW = "ai-review"
GITHUB_LABEL_SKILL_PREFIX = "skill:"

# SECRETS, set with `wrangler secret put <NAME>`, never in this file:
#   CAT_FACTORY_API_KEY        a cat-factory public-API key (cf_live_<keyId>.<secret>),
#                              with the `decide` scope: a review parks on its
#                              findings, and cat-factory will not start a run
#                              through a key that could not then answer it
#   GITHUB_APP_PRIVATE_KEY     the App's private key, PKCS#8 PEM. GitHub issues
#                              PKCS#1; convert it once with
#                              `openssl pkcs8 -topk8 -nocrypt -in key.pem -out key.pk8.pem`
#   GITHUB_OAUTH_CLIENT_ID     the App's own OAuth client, for "Sign in with GitHub"
#   GITHUB_OAUTH_CLIENT_SECRET
#   GITHUB_TOKEN               a personal access token, for a deployment with no App
#   GITHUB_WEBHOOK_SECRET      the shared secret the webhook signature is checked against
#   GITLAB_TOKEN               a personal or group access token, for GitLab projects
#   GITLAB_OAUTH_CLIENT_ID     the OAuth application behind "Sign in with GitLab"
#   GITLAB_OAUTH_CLIENT_SECRET
#   SLACK_BOT_TOKEN            xoxb-… for the Slack bot
#   SLACK_SIGNING_SECRET       the secret Slack signs its requests with
#   AUTH_API_KEY               this deployment's own API key, for CI and for the
#                              first call into a `required` deployment that has
#                              no sessions yet (`Authorization: Bearer <key>`)
#   SETTINGS_ENCRYPTION_KEY    seals the credentials entered on the Configuration
#                              screen and signs the connect round trips
#                              (`openssl rand -base64 32`)
#
# Every one of them is OPTIONAL. A Worker with none of them set still serves the
# board and reports the gaps on /health, which is what makes the first deploy
# possible before any app registration exists.
#
# The three GitHub credentials are not alternatives to choose between at deploy
# time: whichever are configured are offered on the Configuration screen, and the
# strongest present is what calls are made with (the App, then a sign-in, then a
# stored token, then GITHUB_TOKEN). GitLab follows the same order minus the App,
# which it has no equivalent of.
